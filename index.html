<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campo Matemático</title>
<meta name="description" content="Planes de mejoramiento del Campo Matemático por ciclo, periodo y docente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --vino:#9E445E; --vino-osc:#6E2A40; --vino-claro:#F6E7EC;
  --oro:#E3A33B; --oro-txt:#9A6410; --azul:#2F6F9F; --verde:#3E8E6A;
  --bg:#FBF8F6; --panel:#FFFFFF; --texto:#2A2126; --suave:#6B5F65; --borde:#EADFE3;
  --aviso-bg:#FFF6E3; --aviso-tx:#6B4A00;
  --sombra:0 10px 30px -14px rgba(110,42,64,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1519; --panel:#261E23; --texto:#F3ECEF; --suave:#BCAEB5; --borde:#3A2E34;
    --vino:#D2728F; --vino-claro:#3A2230; --oro-txt:#F0C06E; --azul:#6FA8D6;
    --aviso-bg:#3A2E14; --aviso-tx:#F3D99A; --sombra:0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1519; --panel:#261E23; --texto:#F3ECEF; --suave:#BCAEB5; --borde:#3A2E34;
  --vino:#D2728F; --vino-claro:#3A2230; --oro-txt:#F0C06E; --azul:#6FA8D6;
  --aviso-bg:#3A2E14; --aviso-tx:#F3D99A; --sombra:0 10px 30px -14px rgba(0,0,0,.6);
}

.tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--borde);background:transparent;color:var(--suave);font-weight:800;font-size:14px;padding:8px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tabs button small{font-weight:800;font-size:12px;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--vino-claro);color:var(--vino);text-align:center}
.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.tabs button.on small{background:rgba(255,255,255,.25);color:#fff}
.ciclo-cuerpo{margin-top:6px}
.docentes{display:grid;gap:10px;margin-top:16px}
.doc{border:1px solid var(--borde);border-radius:16px;background:var(--bg);overflow:hidden}
.doc-fila{display:flex;align-items:center;gap:10px;padding-right:12px}
.doc-cab{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 14px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;font:inherit}
.doc-cab .av{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.doc-cab .nom{display:block;min-width:0}
.doc-cab .nom b{display:block;overflow-wrap:anywhere}
.doc-cab .nom small{color:var(--suave);font-size:13px}
.doc-cab .flecha{margin-left:auto;transition:transform .2s;color:var(--suave);flex:none}
.doc.abierto .flecha{transform:rotate(180deg)}
.doc-cuerpo{padding:2px 14px 14px;border-top:1px solid var(--borde)}
.doc-cuerpo .lista{margin-top:12px}
.btn.sm{padding:7px 12px;font-size:13px;flex:none}
.sin-res{color:var(--suave);padding:14px 4px}

footer.contacto{padding:0;margin-top:8px;border-top:1px solid var(--borde);background:transparent;color:var(--suave);text-align:center;font-size:13px}
.contacto .wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 22px;padding-block:14px 18px}
.contacto .c{min-width:0;overflow-wrap:anywhere}
.contacto .c b{color:var(--vino);font-weight:800}
.contacto a{color:var(--texto);font-weight:800;text-decoration:none;border-bottom:1.5px solid var(--vino)}
.contacto a:hover{color:var(--vino)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--texto);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.escudo{width:48px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:none}
.escudo img{max-width:100%;max-height:100%}
.marca{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.marca b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca span{font-size:12px;color:var(--suave)}
.menu{margin-left:auto;display:flex;gap:4px}
.menu a{text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;white-space:nowrap;color:var(--suave)}
.menu a:hover{background:var(--vino-claro);color:var(--vino)}
@media (max-width:800px){.menu{display:none}}
.rol{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--vino-claro);color:var(--vino);white-space:nowrap}
@media (min-width:801px){.rol{margin-left:8px}}

.hero{position:relative;padding-block:44px 28px;overflow:hidden;isolation:isolate}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;text-align:center}}
.sello{display:inline-block;background:var(--vino-claro);color:var(--vino);font-weight:800;font-size:12.5px;padding:6px 14px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(40px,7vw,70px);font-weight:800;margin:14px 0 10px;color:var(--vino)}
.hero h1 small{display:block;font-size:.4em;color:var(--texto);font-weight:600;margin-bottom:6px}
.lema{font-size:clamp(17px,2.2vw,20px);color:var(--suave);max-width:34em;margin:0}
@media (max-width:860px){.lema{margin:0 auto}}
.pilares{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
@media (max-width:860px){.pilares{justify-content:center}}
.pilar{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--borde);padding:6px 14px 6px 6px;border-radius:999px;font-weight:800}
.pilar i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pilar i svg{width:17px;height:17px}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:24px;background:var(--vino);color:#fff;text-decoration:none;font-weight:800;padding:13px 22px;border-radius:14px}
.cta:hover{background:var(--vino-osc)}

.logo-anim{width:min(520px,100%);margin:0 auto;display:block;overflow:visible}
.nucleo{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both,golpe 4s .6s ease-out infinite}
@keyframes pop{from{transform:scale(0)}}
@keyframes golpe{0%{transform:scale(1)}6%{transform:scale(1.08)}16%{transform:scale(.98)}26%,100%{transform:scale(1)}}
.sigma{transform-box:fill-box;transform-origin:center;animation:caer .6s .3s cubic-bezier(.3,1.6,.5,1) both,golpe 4s .6s ease-out infinite}
@keyframes caer{from{transform:translateY(-30px) scale(.4);opacity:0}}
.pieza{transform-box:fill-box;transform-origin:center;animation:estallar 4s cubic-bezier(.2,1,.3,1) infinite both}
@keyframes estallar{0%{transform:translate(var(--dx),var(--dy)) scale(0) rotate(0);opacity:0}6%{opacity:1}22%{transform:translate(0,0) scale(1.2) rotate(calc(var(--g) * .5))}32%{transform:translate(0,0) scale(1) rotate(calc(var(--g) * .6))}90%{transform:translate(0,0) scale(1) rotate(var(--g));opacity:1}100%{transform:translate(calc(var(--dx) * -.25),calc(var(--dy) * -.25)) scale(.5) rotate(calc(var(--g) * 1.3));opacity:0}}
.giro{transform-origin:200px 200px;animation:vaiven 10s ease-in-out infinite}
@keyframes vaiven{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes girar{to{transform:rotate(360deg)}}
.anillo{transform-origin:200px 200px;animation:girar 8s linear infinite reverse}
.espiral{stroke-dasharray:1;animation:trazar 4s .6s ease-out infinite both}
@keyframes trazar{0%{stroke-dashoffset:1}40%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.aura{transform-box:fill-box;transform-origin:center;animation:aura 4s .6s ease-out infinite both}
@keyframes aura{0%{transform:scale(.7);opacity:1}40%{transform:scale(1.15);opacity:.6}100%{transform:scale(.9);opacity:.8}}
.simbolos{position:absolute;inset:0;pointer-events:none;z-index:-1}
.simbolos span{position:absolute;font-family:Fraunces,Georgia,serif;font-weight:800;color:var(--vino);opacity:.07;animation:subir linear infinite alternate}
@keyframes subir{from{transform:translateY(30px) rotate(0)}to{transform:translateY(-50px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

.bloque{padding-block:40px}
.titulo-sec{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.titulo-sec h2{font-size:clamp(28px,4vw,36px)}
.titulo-sec p{margin:6px 0 0;color:var(--suave)}
.indice{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media (max-width:980px){.indice{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.indice{grid-template-columns:1fr 1fr}}
.tarjeta{position:relative;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--borde);border-radius:20px;padding:18px 16px 16px;box-shadow:var(--sombra);transition:transform .25s;overflow:hidden;display:flex;flex-direction:column;gap:4px;min-height:164px}
.tarjeta:hover{transform:translateY(-5px)}
.tarjeta::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.12;transition:transform .4s}
.tarjeta:hover::after{transform:scale(1.35)}
.tarjeta .num{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:42px;color:var(--c);line-height:1}
.tarjeta b{font-size:17px}
.tarjeta small{color:var(--suave);font-size:13px}
.tarjeta .cont{margin-top:auto;font-size:13px;font-weight:800;color:var(--c)}
.tarjeta svg{position:absolute;right:12px;top:12px;width:36px;height:36px;color:var(--c)}

.ciclo{scroll-margin-top:84px;background:var(--panel);border:1px solid var(--borde);border-radius:24px;padding:24px;margin-bottom:22px}
@media (max-width:600px){.ciclo{padding:18px}}
.ciclo-cab{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ciclo-cab .ct{flex:1;min-width:0}
.ciclo-cab .flecha{font-size:22px;color:var(--vino);transition:transform .2s}
.ciclo.abierto .ciclo-cab .flecha{transform:rotate(180deg)}
.ciclo-cab:focus-visible{outline:3px solid var(--oro);outline-offset:4px;border-radius:14px}
.insignia{width:60px;height:60px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px;flex:none}
.ciclo-cab h3{font-size:25px}
.ciclo-cab p{margin:2px 0 0;color:var(--suave);font-size:14.5px}
.ciclo-cab .acciones{margin-left:auto}
.btn{border:0;cursor:pointer;font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--c,var(--vino));color:#fff}
.btn.sec{background:transparent;color:var(--texto);border:1.5px solid var(--borde)}
.btn.peligro{background:#B3261E;color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:wait}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.filtros button{border:1.5px solid var(--borde);background:transparent;color:var(--suave);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.filtros button.on{background:var(--c);border-color:var(--c);color:#fff}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.plan{border:1px solid var(--borde);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:var(--bg)}
.tipo{width:44px;height:52px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;clip-path:polygon(0 0,70% 0,100% 22%,100% 100%,0 100%)}
.plan .info{min-width:0;flex:1}
.plan .info b{display:block;font-size:15px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--suave);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;font-variant-numeric:tabular-nums}
.ops{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.ops button{font-size:13px;font-weight:800;color:var(--c);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ops button.quitar{color:#B3261E}
.vacio{border:2px dashed var(--borde);border-radius:16px;padding:22px;text-align:center;color:var(--suave);grid-column:1/-1}
.vacio svg{width:64px;height:64px;color:var(--c);opacity:.85}
.vacio p{margin:6px 0 0}

.velo{position:fixed;inset:0;background:rgba(20,10,15,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);color:var(--texto);border-radius:22px;max-width:520px;width:100%;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.modal.ancho{max-width:900px;padding:0;display:flex;flex-direction:column}
.modal h3{font-size:22px;margin-bottom:12px}
.visor-cab{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--borde);position:sticky;top:0;background:var(--panel);z-index:1;flex-wrap:wrap}
.visor-cab b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visor-cuerpo{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--bg)}
.visor-cuerpo canvas,.visor-cuerpo img{max-width:100%;height:auto;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15);border-radius:4px}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.campo label{font-weight:800;font-size:13px}
.campo input,.campo select{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--borde);background:var(--bg);color:var(--texto);min-width:0}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aviso{font-size:13.5px;background:var(--aviso-bg);color:var(--aviso-tx);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.pie{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.medidor{margin-top:14px;font-size:13px;color:var(--suave)}
.medidor .barra{height:8px;border-radius:99px;background:var(--borde);overflow:hidden;margin-top:6px}
.medidor .barra i{display:block;height:100%;background:var(--vino)}
.panel-admin{background:var(--vino-claro);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.panel-admin .txt{flex:1;min-width:220px;font-size:14px}
.panel-admin .medidor{margin:0;min-width:200px;flex:1}
footer{padding-block:30px 46px;color:var(--suave);font-size:14px;text-align:center}
footer .escudo{margin:0 auto 10px;width:60px;height:52px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--texto);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;transition:transform .3s;z-index:60;max-width:calc(100% - 32px)}
.toast.ver{transform:translate(-50%,0)}
.toast:empty{visibility:hidden}
</style>
</head><body>

function simbolos(){
  const s = ["π","∑","√","∞","x²","÷","△","∫","%","≠","θ","+"]; let h = "";
  for (let i = 0; i < 20; i++) h += `<span style="left:${(i*37)%100}%;top:${(i*53)%100}%;font-size:${18+(i*7)%36}px;animation-duration:${8+(i%5)*2}s">${s[i%s.length]}</span>`;
  return h;
}
function tarjetaPlan(p, c){

}

        <span class="pilar" title="Argumentar y demostrar paso a paso"><i style="background:#9E445E">${ICONOS.red}</i>Razonar: argumentar y demostrar</span>
        <span class="pilar" title="Buscar caminos propios para resolver"><i style="background:#E3A33B">${ICONOS.foco}</i>Crear: resolver de nuevas formas</span>
      </div>
      <a class="cta" href="#indice">Ver planes de mejoramiento ↓</a></div>
    ${logoAnimado()}
  </div></section>
  <section class="bloque" id="indice"><div class="wrap">
    <div class="titulo-sec"><div><h2>Índice de ciclos</h2><p>${n ? `${n} ${n===1?"plan publicado":"planes publicados"}. Elige tu ciclo.` : "Elige tu ciclo, luego el periodo y tu docente para ver y descargar tu plan de mejoramiento."}</p></div></div>
    <div class="indice">${CICLOS.map(c=>{const k=planesDe(c.id).length;return `<a class="tarjeta" href="#${c.id}" style="--c:${c.color}">${ICONOS[c.icono]}<span class="num">${c.corto}</span><b>${c.nombre}</b><small>${c.sub}</small><span class="cont">${k} ${k===1?"plan":"planes"} →</span></a>`}).join("")}</div>
  </div></section>
  <section class="bloque" style="padding-top:0"><div class="wrap">${CICLOS.map(seccion).join("")}</div></section>
  <footer class="contacto"><div class="wrap">
    <span class="c"><b>Sede A</b> Calle 37 A bis sur # 2 A 04 · Tel. 3626978</span>
    <span class="c">cedalemaniaunificada@educacionbogota.edu.co</span>
    <span class="c">alemaniaunificadacol@alemaniaunificadaied.edu.co</span>
    <span class="c">WhatsApp y celular <a href="https://wa.me/573002073022" target="_blank" rel="noopener">3002073022</a></span>
  </div></footer>
  <div id="capa"></div><div class="toast" id="toast" role="status"></div>`;
}
function getV(id){ return vista[id] || (vista[id] = {per: PERIODOS[0], abierto: false, abiertos: {}}); }
function seccion(c){
  const v = getV(c.id), todos = planesDe(c.id);
  return `<article class="ciclo ${v.abierto?"abierto":""}" id="${c.id}" style="--c:${c.color}">
    <button type="button" class="ciclo-cab" data-ciclo="${c.id}" aria-expanded="${v.abierto}"><div class="insignia">${c.corto}</div><div class="ct"><h3>${c.nombre}</h3><p>${c.sub} · ${todos.length} ${todos.length===1?"plan":"planes"}</p></div><span class="flecha" aria-hidden="true">▾</span></button>
    ${v.abierto?`<div class="ciclo-cuerpo">
    <div class="tabs" role="group" aria-label="Periodo de ${c.nombre}">${PERIODOS.map(per => {const k = todos.filter(p => p.periodo === per).length; return `<button type="button" data-per="${c.id}" data-val="${per}" aria-pressed="${per===v.per}" class="${per===v.per?"on":""}">${per}<small>${k}</small></button>`}).join("")}</div>
    <div class="docentes" id="doc-${c.id}">${docentes(c)}</div></div>`:""}
  </article>`;
}
function docentes(c){
  const v = getV(c.id);
  const delPer = planesDe(c.id).filter(p => p.periodo === v.per);
  const bloques = DOCENTES.map(d => {
    const mios = delPer.filter(p => p.docente === d).sort((x,y) => (x.estudiante||"").localeCompare(y.estudiante||"", "es"));
    const vis = mios;
    const abierto = !!v.abiertos[v.per + "|" + d];
    const n = mios.length;
    return `<div class="doc ${abierto?"abierto":""}"><div class="doc-fila">
      <button type="button" class="doc-cab" data-doc="${c.id}" data-d="${esc(d)}" aria-expanded="${abierto}"><span class="av" style="--c:${c.color}">${iniciales(d)}</span><span class="nom"><b>${esc(d)}</b><small>${n} ${n===1?"plan":"planes"} de mejoramiento · ${v.per}</small></span><span class="flecha" aria-hidden="true">▾</span></button>
    </div>${abierto?`<div class="doc-cuerpo"><div class="lista">${vis.length ? vis.map(p => tarjetaPlan(p,c)).join("") : `<div class="vacio">${ICONOS[c.icono]}<p><b>Aún no hay planes de ${esc(d)} en ${v.per}.</b><br>Muy pronto estarán disponibles.</p></div>`}</div></div>`:""}</div>`;
  }).join("");
  return bloques;
}
function repintarDocentes(id){ const c = CICLOS.find(x => x.id === id); const el = document.getElementById("doc-" + id); if (el) el.innerHTML = docentes(c); }
function repintarCiclo(id){ const c = CICLOS.find(x => x.id === id); const el = document.getElementById(id); if (el) el.outerHTML = seccion(c); }


/* ---------------- Descarga con registro ---------------- */
function guardado(){ try { return JSON.parse(localStorage.getItem("cm_lector") || "{}"); } catch(e){ return {}; } }
function pedirRegistro(id){
  const p = estado.planes.find(x => x.id === id); if (!p) return;
  const g = guardado();
  $("#capa").innerHTML = `<div class="velo" data-cerrar><form class="modal" id="formReg" aria-labelledby="rT">
    <h3 id="rT">Antes de descargar</h3>
    <p class="aviso">Escribe tu nombre y tu curso para registrar la descarga del plan de mejoramiento de <b>${esc(p.estudiante)}</b> (${esc(p.docente)} · ${esc(p.periodo)}).</p>
    <div class="campo"><label for="rNombre">Tu nombre completo</label><input id="rNombre" required maxlength="80" autocomplete="name" value="${esc(g.nombre||"")}" placeholder="Nombres y apellidos"></div>
    <div class="campo"><label for="rCurso">Tu curso</label><input id="rCurso" required maxlength="20" autocomplete="off" value="${esc(g.curso||"")}" placeholder="Ej. 601"></div>
    <div class="pie"><button type="button" class="btn sec" data-cerrar-btn>Cancelar</button><button class="btn pri" style="--c:#9E445E" id="bReg">Registrar y descargar</button></div>
  </form></div>`;
  $("#formReg").addEventListener("submit", async e => {
    e.preventDefault();
    const nombre = $("#rNombre").value.trim().replace(/\s+/g," "), curso = $("#rCurso").value.trim();
    if (!nombre || !curso) return;
    $("#bReg").disabled = true; $("#bReg").textContent = "Registrando…";
    try { localStorage.setItem("cm_lector", JSON.stringify({nombre, curso})); } catch(_) {}
    await registrar(p, nombre, curso);
    cerrarCapa(); bajar(p);
  });
  setTimeout(() => $("#rNombre").focus(), 30);
}
async function registrar(p, nombre, curso){
  if (!CFG.REGISTRO_URL) return;
  const datos = { descargo: nombre, curso_descargo: curso, plan_id: p.id, estudiante_plan: p.estudiante, curso_plan: p.curso, ciclo: p.ciclo, periodo: p.periodo, docente: p.docente, archivo: p.archivo };
  try { await fetch(CFG.REGISTRO_URL, { method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(datos) }); } catch(e) {}
}
function bajar(p){
  const a = document.createElement("a");
  a.href = "planes/" + encodeURIComponent(p.archivo); a.download = p.archivo; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Descarga iniciada.");
}
function cerrarCapa(){ $("#capa").innerHTML = ""; }

/* ---------------- Eventos ---------------- */
document.addEventListener("click", e => {
  if (e.target.matches("[data-cerrar]") || e.target.closest("[data-cerrar-btn]")) { cerrarCapa(); return; }
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (a) { const id = a.getAttribute("href").slice(1); if (CICLOS.some(c => c.id === id)) { const v = getV(id); if (!v.abierto) { v.abierto = true; repintarCiclo(id); } const el = document.getElementById(id); if (el) { e.preventDefault(); el.scrollIntoView({behavior:"smooth", block:"start"}); } return; } }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.ciclo) { const v = getV(b.dataset.ciclo); v.abierto = !v.abierto; repintarCiclo(b.dataset.ciclo); }
  else if (b.dataset.per) { const v = getV(b.dataset.per); v.per = b.dataset.val; repintarCiclo(b.dataset.per); }
  else if (b.dataset.doc) { const v = getV(b.dataset.doc), k = v.per + "|" + b.dataset.d; v.abiertos[k] = !v.abiertos[k]; repintarDocentes(b.dataset.doc); }
  else if (b.dataset.bajar) pedirRegistro(b.dataset.bajar);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarCapa(); });

pintar();
fetch("planes.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {planes: []}).catch(() => ({planes: []}))
  .then(d => { estado.planes = (d && d.planes) || []; pintar(); });
</script>
</body></html>
